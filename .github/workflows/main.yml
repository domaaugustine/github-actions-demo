name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Message
        run: echo "GitHub Actions Workflow Executed Successfully!"

      - name: Display Date
        run: date

      - name: List Files
        run: ls -la